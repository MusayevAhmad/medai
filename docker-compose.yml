# ---------------------------------------------------------------------------
# BioScholar – Docker Compose
#
# Services:
#   qdrant  – Vector database (persistent storage)
#   api     – FastAPI backend (NER + retrieval + LLM)
#
# Usage:
#   docker-compose up              # start both services
#   docker-compose up -d           # start in background
#   docker-compose down            # stop and remove containers
#   docker-compose logs -f api     # follow API logs
#
# Prerequisites:
#   - Trained NER model in outputs/models/run_*/final_model/
#   - (Optional) Ollama running on the host for LLM generation
# ---------------------------------------------------------------------------

services:
  # ---------- Qdrant Vector Database ----------
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: bioscholar-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  # ---------- BioScholar FastAPI Backend ----------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bioscholar-api
    ports:
      - "8000:8000"
    volumes:
      # Mount trained models (read-only – no accidental overwrites)
      - ./outputs/models:/app/outputs/models:ro
      # Persist query logs
      - ./outputs/logs:/app/outputs/logs
      # Shared demo data (PDF staging + extracted figures)
      - ./data/raw_pdfs:/app/data/raw_pdfs
      - ./data/figures:/app/data/figures
    environment:
      # NER model – auto-detected from mounted outputs/models/
      - NER_MODEL_PATH=
      # Qdrant – connect to the qdrant service container
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=bio_guidelines
      # Use local persistent storage when Qdrant runs in Docker
      - QDRANT_PATH=
      # LLM – Ollama running on the Docker host
      # host.docker.internal resolves to the host machine from inside containers
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LLM_MODEL=llama3.2
    depends_on:
      - qdrant
    restart: unless-stopped

  # ---------- Streamlit Demo UI ----------
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: bioscholar-streamlit
    ports:
      - "8501:8501"
    environment:
      - BIOSCHOLAR_API_URL=http://api:8000
    volumes:
      - ./data/raw_pdfs:/app/data/raw_pdfs
      - ./data/figures:/app/data/figures
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_data:
    driver: local
